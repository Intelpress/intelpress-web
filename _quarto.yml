project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!distribution/"

website:
  title: "Intelpress"
  site-url: "https://intelpress.cl"
  description: "Media Intelligence & Data Sovereignty"
  navbar:
    background: "#16161e"
    search: true
