project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "servicios/*.qmd"
    - "sectores/*.qmd"
    - "newsletter/*.qmd"
    - "tecnologia/*.qmd"
    - "metodologia/*.qmd"
    - "!distribution/"

website:
  title: "Intelpress"
  site-url: "https://intelpress.cl"
  description: "Presencia Inteligente — Inteligencia de medios para Chile"
  navbar:
    background: light
    search: true
    pinned: false
    left:
      - href: index.qmd
        text: "Inicio"
      - href: servicios/index.qmd
        text: "Servicios"
      - href: sectores/index.qmd
        text: "Sectores"
      - href: newsletter/index.qmd
        text: "Newsletter"
      - href: tecnologia/index.qmd
        text: "Tecnología"
      - href: metodologia/index.qmd
        text: "Metodología"
    right:
      - href: contacto.qmd
        text: "Contacto"

format:
  html:
    theme:
      dark: darkly
      light: cosmo
    css: styles.css
    toc: false
    toc-depth: 3
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
